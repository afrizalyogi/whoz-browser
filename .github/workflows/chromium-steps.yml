name: Whoz (Chromium) build chain
# Up to 15 chained stages of at most 6 hours each; a stage that finishes early packages too.
on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      runs-on:
        required: true
        type: string
    outputs:
      version:
        value: ${{ jobs.done.outputs.version }}

permissions:
  contents: read

jobs:
  build-1:
    uses: ./.github/workflows/chromium-stage.yml
    with:
      arch: ${{ inputs.arch }}
      runs-on: ${{ inputs.runs-on }}
      from-artifact: false

  build-2:
    needs: build-1
    if: needs.build-1.outputs.finished == 'false'
    uses: ./.github/workflows/chromium-stage.yml
    with:
      arch: ${{ inputs.arch }}
      runs-on: ${{ inputs.runs-on }}
      from-artifact: true

  build-3:
    needs: build-2
    if: needs.build-2.outputs.finished == 'false'
    uses: ./.github/workflows/chromium-stage.yml
    with:
      arch: ${{ inputs.arch }}
      runs-on: ${{ inputs.runs-on }}
      from-artifact: true

  build-4:
    needs: build-3
    if: needs.build-3.outputs.finished == 'false'
    uses: ./.github/workflows/chromium-stage.yml
    with:
      arch: ${{ inputs.arch }}
      runs-on: ${{ inputs.runs-on }}
      from-artifact: true

  build-5:
    needs: build-4
    if: needs.build-4.outputs.finished == 'false'
    uses: ./.github/workflows/chromium-stage.yml
    with:
      arch: ${{ inputs.arch }}
      runs-on: ${{ inputs.runs-on }}
      from-artifact: true

  build-6:
    needs: build-5
    if: needs.build-5.outputs.finished == 'false'
    uses: ./.github/workflows/chromium-stage.yml
    with:
      arch: ${{ inputs.arch }}
      runs-on: ${{ inputs.runs-on }}
      from-artifact: true

  build-7:
    needs: build-6
    if: needs.build-6.outputs.finished == 'false'
    uses: ./.github/workflows/chromium-stage.yml
    with:
      arch: ${{ inputs.arch }}
      runs-on: ${{ inputs.runs-on }}
      from-artifact: true

  build-8:
    needs: build-7
    if: needs.build-7.outputs.finished == 'false'
    uses: ./.github/workflows/chromium-stage.yml
    with:
      arch: ${{ inputs.arch }}
      runs-on: ${{ inputs.runs-on }}
      from-artifact: true

  build-9:
    needs: build-8
    if: needs.build-8.outputs.finished == 'false'
    uses: ./.github/workflows/chromium-stage.yml
    with:
      arch: ${{ inputs.arch }}
      runs-on: ${{ inputs.runs-on }}
      from-artifact: true

  build-10:
    needs: build-9
    if: needs.build-9.outputs.finished == 'false'
    uses: ./.github/workflows/chromium-stage.yml
    with:
      arch: ${{ inputs.arch }}
      runs-on: ${{ inputs.runs-on }}
      from-artifact: true

  build-11:
    needs: build-10
    if: needs.build-10.outputs.finished == 'false'
    uses: ./.github/workflows/chromium-stage.yml
    with:
      arch: ${{ inputs.arch }}
      runs-on: ${{ inputs.runs-on }}
      from-artifact: true

  build-12:
    needs: build-11
    if: needs.build-11.outputs.finished == 'false'
    uses: ./.github/workflows/chromium-stage.yml
    with:
      arch: ${{ inputs.arch }}
      runs-on: ${{ inputs.runs-on }}
      from-artifact: true

  build-13:
    needs: build-12
    if: needs.build-12.outputs.finished == 'false'
    uses: ./.github/workflows/chromium-stage.yml
    with:
      arch: ${{ inputs.arch }}
      runs-on: ${{ inputs.runs-on }}
      from-artifact: true

  build-14:
    needs: build-13
    if: needs.build-13.outputs.finished == 'false'
    uses: ./.github/workflows/chromium-stage.yml
    with:
      arch: ${{ inputs.arch }}
      runs-on: ${{ inputs.runs-on }}
      from-artifact: true

  build-15:
    needs: build-14
    if: needs.build-14.outputs.finished == 'false'
    uses: ./.github/workflows/chromium-stage.yml
    with:
      arch: ${{ inputs.arch }}
      runs-on: ${{ inputs.runs-on }}
      from-artifact: true

  # Build finished too late in its stage to package there: package on a fresh runner.
  package:
    needs: [build-1, build-2, build-3, build-4, build-5, build-6, build-7, build-8, build-9, build-10, build-11, build-12, build-13, build-14, build-15]
    if: ${{ !cancelled() && !failure() && join(needs.*.outputs.version, '') == '' }}
    runs-on: ${{ inputs.runs-on }}
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/prepare-environment
      - uses: ./.github/actions/package
        id: package
        with:
          arch: ${{ inputs.arch }}

  # The stage (or package job) that packaged reports the version.
  done:
    needs: [build-1, build-2, build-3, build-4, build-5, build-6, build-7, build-8, build-9, build-10, build-11, build-12, build-13, build-14, build-15, package]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          VERSIONS: ${{ join(needs.*.outputs.version, ' ') }}
        run: |
          v=$(echo "$VERSIONS" | xargs)
          if [ -z "$v" ]; then echo "No stage packaged the build"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"