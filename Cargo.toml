[package]
name = "whoz-browser"
version = "0.2.0"
edition = "2021"
authors = ["Afrizal Yogi <afrizalyogi@aryatama.co.id>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/afrizalyogi/whoz-browser"
description = "Headerless, minimal Windows browser on WebView2"

[[bin]]
name = "whoz"
path = "src/main.rs"

[dependencies]
tao = "0.37"
wry = "0.57"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
