[workspace]
members = [
    "crates/whoz-core",
    "crates/whoz-sync",
    "crates/whoz-extensions",
    "crates/whoz-bridge",
    "crates/whoz-ui",
    "crates/whoz-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Afrizal Yogi <afrizalyogi@aryatama.co.id>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/afrizalyogi/whoz-browser"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
bytes = "1.10"
sha2 = "0.10"
aes-gcm = "0.10"
prost = "0.13"
prost-types = "0.13"
mimalloc = { version = "0.1", default-features = false }
