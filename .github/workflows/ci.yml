name: CI

# Every push and pull request is checked and packaged.
# A push to main whose Cargo.toml version has no release yet publishes v<version> automatically.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - id: version
        shell: pwsh
        run: |
          $v = (Select-String Cargo.toml '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: .\package.ps1
        shell: pwsh
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/whoz-browser-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$h  whoz-browser-windows-x64.zip" | Set-Content dist/SHA256SUMS.txt -NoNewline
      - uses: actions/upload-artifact@v7
        with:
          name: whoz-browser-windows-x64
          path: |
            dist/whoz-browser-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.build.outputs.version }}
    steps:
      - name: Skip if this version is already released
        id: check
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$TAG already released; bump the version in Cargo.toml to publish a new one."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.new == 'true'
        uses: actions/download-artifact@v8
        with:
          name: whoz-browser-windows-x64
          path: dist
      - if: steps.check.outputs.new == 'true'
        run: |
          gh release create "$TAG" dist/whoz-browser-windows-x64.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Whoz $TAG" --generate-notes
